<!DOCTYPE html>
<html lang="en">
<head>

<title>lessico</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#1E2D2F;--bg2:#223335;--paper:#F6F1E6;--edge:#EBE3D2;--ink:#2A2823;--line:rgba(246,241,230,.10);--green:#7A9A57;--ochre:#CB9235}
*{box-sizing:border-box}
html,body{margin:0}
/* Touch browsers paint their own translucent flash over whatever you press — rounded edge and all —
   for as long as the press lasts, which a 600ms hold makes very visible, in a blue that has nothing
   to do with this palette. The app's own :active and the hold sweep are the feedback. Inherited,
   so this one line covers every tappable thing. */
html{-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(120% 120% at 50% 0%,var(--bg2) 0%,var(--bg) 60%) fixed;color:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px calc(84px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.logo{font-family:'Fraunces',serif;font-weight:600;font-size:28px;letter-spacing:-.02em}
.logo i{color:var(--green);font-style:normal}
.counts{text-align:right;font-size:12px;color:rgba(246,241,230,.55);line-height:1.5;position:relative}
.counts b{color:var(--paper);display:inline-block;position:relative}
.counts b.pop{animation:learnpop .6s cubic-bezier(.34,1.56,.64,1)}
.counts b.pop::after{content:"";position:absolute;left:50%;top:50%;width:1.5em;height:1.5em;margin:-.75em 0 0 -.75em;border-radius:50%;border:1px solid var(--green);pointer-events:none;animation:learnring .7s ease-out forwards}
@keyframes learnpop{0%{transform:scale(1);color:var(--paper)}22%{transform:scale(1.32);color:var(--green)}62%{color:var(--green)}100%{transform:scale(1);color:var(--paper)}}
@keyframes learnring{0%{opacity:.5;transform:scale(.5)}100%{opacity:0;transform:scale(1.8)}}
.counts .plusone{position:absolute;right:0;top:-3px;font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--ochre);pointer-events:none;animation:plusrise .9s ease-out forwards}
@keyframes plusrise{0%{opacity:0;transform:translateY(3px)}25%{opacity:.95}100%{opacity:0;transform:translateY(-15px)}}
@media(prefers-reduced-motion:reduce){.counts b.pop,.counts b.pop::after,.counts .plusone{animation:none}}
.milestone{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:60;pointer-events:none;background:var(--paper);color:var(--ink);border:1px solid var(--edge);border-radius:14px;padding:11px 22px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.30);animation:milein 2.8s ease forwards}
.milestone .mtop{font-family:'Fraunces',serif;font-weight:600;font-size:16px;letter-spacing:.01em}
.milestone .msub{margin-top:3px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--green)}
@keyframes milein{0%{opacity:0;transform:translate(-50%,-9px)}9%{opacity:1;transform:translate(-50%,0)}86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@media(prefers-reduced-motion:reduce){.milestone{animation:none}}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(18,28,29,.66);display:flex;align-items:center;justify-content:center;padding:24px;animation:scrimin .16s ease-out}
.sheet{width:100%;max-width:330px;background:var(--paper);color:var(--ink);border:1px solid var(--edge);border-radius:18px;padding:24px 24px 20px;box-shadow:0 26px 58px -18px rgba(0,0,0,.6);text-align:center;animation:sheetin .22s cubic-bezier(.2,.85,.25,1)}
.sheet h3{font-family:'Fraunces',serif;font-weight:600;font-size:20px;line-height:1.25;letter-spacing:-.01em;margin:0 0 8px;overflow-wrap:anywhere}
.sheet p{font-size:13.5px;line-height:1.55;color:#5E5A4E;margin:0 0 20px}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet button{font-family:inherit;font-weight:600;font-size:14.5px;border-radius:12px;padding:12px 14px;cursor:pointer;border:1px solid transparent}
.sheet button:active{transform:translateY(1px)}
.sheet .no{background:transparent;border-color:rgba(42,40,35,.18);color:rgba(42,40,35,.7)}
.sheet .yes{background:var(--ink);color:var(--paper)}
.sheet .yes.dngr{background:#9E4B2B}
@keyframes scrimin{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.scene{perspective:1600px;margin-bottom:18px;position:relative}
.card{position:relative;width:100%;min-height:clamp(300px,48vw,380px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.85,.25,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 22px 44px -20px rgba(0,0,0,.55),0 2px 0 var(--edge);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.spine{position:absolute;left:0;top:0;bottom:0;width:7px}
.word{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,8vw,44px);line-height:1.08;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere;hyphens:auto}
.sentence{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(19px,5.2vw,23px);line-height:1.55;color:#3B382E;margin-top:16px;max-width:40ch;overflow-wrap:anywhere}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:18px}
.dots{display:inline-flex;gap:5px;flex-wrap:wrap}
.dots span{width:7px;height:7px;border-radius:999px;background:rgba(42,40,35,.16)}
.dots span.f{background:var(--ink)}
.dots span.g{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(42,40,35,.34)}  /* a dot you had */
.dots span.h{background:rgba(42,40,35,.42)}                                            /* met, not yet recalled */
.dots.ret span{background:#C8912F;box-shadow:0 0 0 1px rgba(200,145,47,.35)}
.dots .star{width:auto;height:auto;background:none;font-size:11px;line-height:1;color:#C8912F;margin-left:2px}
.say{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:999px;border:1px solid rgba(42,40,35,.16);background:rgba(42,40,35,.04);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.55;z-index:2}
.say:hover{opacity:.9}
.say:active{transform:translateY(1px)}
.say.playing{opacity:1;background:rgba(122,154,87,.18);border-color:rgba(122,154,87,.5)}
.progress{height:5px;border-radius:999px;background:rgba(246,241,230,.08);overflow:hidden;margin:2px 0 16px}
.progress i{display:block;height:100%;background:var(--green);transition:width .3s}
.pbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(246,241,230,.08)}
.pbar i{display:block;height:100%;transition:width .35s}
.plegend{display:flex;flex-wrap:wrap;gap:3px 13px;margin-top:9px;font-size:11.5px;opacity:.7}
.plegend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.plegend i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.pcap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.45;margin:0 0 7px}
.pbar .s4,.plegend .s4,.seg .s4{background:#C8912F}                      /* mastered — retired for good */
.pbar .s3,.plegend .s3,.seg .s3{background:var(--green)}
.pbar .s2,.plegend .s2,.seg .s2{background:#A7C178}
.pbar .s1,.plegend .s1,.seg .s1{background:#CBB05C}
.pbar .sm,.plegend .sm,.seg .sm{background:rgba(203,146,53,.32)}         /* met, not yet recalled */
.pbar .s0,.plegend .s0,.seg .s0{background:rgba(246,241,230,.16)}        /* not started */
.pbar .new{background:#C7E39A;box-shadow:0 0 8px rgba(199,227,154,.7);animation:newpulse 1.2s ease-in-out 3}
@keyframes newpulse{0%,100%{opacity:1}50%{opacity:.45}}
.state .pbar{max-width:320px;margin:20px auto 0}
.meta{display:flex;justify-content:space-between;font-size:12px;color:rgba(246,241,230,.55);margin-bottom:6px}
.assess{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:13px;padding:15px 16px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--paper);background:rgba(246,241,230,.06)}
.btn:active{transform:translateY(1px)}
.btn.miss{background:rgba(203,146,53,.14);border-color:rgba(203,146,53,.4);color:#EAC98A}
.btn.know{background:rgba(122,154,87,.16);border-color:rgba(122,154,87,.45);color:#BBD69A}
.btn.know{position:relative;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.btn.know>span{position:relative;z-index:1}
/* inset:0 puts the sweep against the padding box, so it fills up to the border and never over it */
.btn.know::after{content:"";position:absolute;inset:0;background:rgba(203,146,53,.5);transform:scaleX(0);transform-origin:left center;pointer-events:none}
.btn.know.hold::after{transform:scaleX(1);transition:transform .6s linear}
.report{background:rgba(246,241,230,.05);border:1px solid rgba(246,241,230,.10);border-radius:14px;padding:16px 18px;margin:2px 0 4px}
.report h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;font-weight:600}
.report ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.report li{display:flex;justify-content:space-between;font-size:14px}
.report li b{font-variant-numeric:tabular-nums}
.report li.dim{opacity:.5}
.report li.tot{border-top:1px solid rgba(246,241,230,.10);margin-top:4px;padding-top:7px}
.rdiv{display:flex;align-items:center;gap:12px;margin:22px 0 6px;opacity:.34;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.rdiv::before,.rdiv::after{content:"";flex:1;height:1px;background:currentColor}
.lede{text-align:center;opacity:.62;font-size:14px;margin:2px 0 14px}
.lede.nudge{opacity:.5;font-size:13px;margin-top:-8px}
.hint{text-align:center;font-size:11px;opacity:.38;margin-top:8px;letter-spacing:.03em}
.moods{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:18px 0 12px}
.moods button{border-radius:999px;padding:7px 15px;font-size:13px;background:transparent;border:1px solid rgba(255,255,255,.16);color:inherit;opacity:.62;cursor:pointer}
.moods button.on{opacity:1;background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.34)}
.recs{margin:26px auto 0;max-width:340px}
.recs>div+div{margin-top:16px}
.recs .pcap{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chips button{font-family:inherit;font-size:13px;color:var(--paper);background:rgba(246,241,230,.06);
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px}
.chips button:hover{background:rgba(246,241,230,.11);border-color:rgba(246,241,230,.26)}
.chips button:active{transform:translateY(1px)}
.chips button i{font-style:normal;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--green);opacity:.9}
.btn.wide{grid-column:1/-1;background:var(--paper);color:var(--ink);border-color:transparent}
.state{text-align:center;padding:34px 18px}
.state .big{font-family:'Fraunces',serif;font-size:24px;margin:0 0 8px}
.state p{color:rgba(246,241,230,.6);font-size:14.5px;line-height:1.55;margin:0 auto 18px;max-width:34ch}
.sec{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:rgba(246,241,230,.42);margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.sec.first{border-top:0;padding-top:0;margin-top:6px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:rgba(246,241,230,.72)}
.field .sub{font-size:11.5px;color:rgba(246,241,230,.42);line-height:1.4}
.inp{font-family:inherit;font-size:15px;color:var(--paper);background:rgba(246,241,230,.05);border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;width:100%}
.inp:focus{border-color:rgba(246,241,230,.34)}
select.inp{appearance:none}
.numrow .inp{width:100px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;background:rgba(246,241,230,.06);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg.segwrap{border-radius:16px;row-gap:4px;align-content:flex-start;justify-content:center}
.seg button{font-family:inherit;font-size:12.5px;font-weight:500;color:rgba(246,241,230,.6);background:transparent;border:0;cursor:pointer;padding:6px 13px;border-radius:999px}
.seg button.on{background:var(--paper);color:var(--ink)}
/* band swatch inside a filter chip, matching the progress bar's colours */
.seg button i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.solid{font-family:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--paper);border:0;border-radius:11px;padding:11px 16px;cursor:pointer}
.ghost{font-family:inherit;font-weight:500;font-size:13px;color:rgba(246,241,230,.78);background:rgba(246,241,230,.05);border:1px solid var(--line);border-radius:11px;padding:10px 14px;cursor:pointer}
.ghost:disabled{opacity:.45}
.dngr{color:#E7B77B;border-color:rgba(231,183,123,.3)}
.btnwrap{display:flex;gap:8px;flex-wrap:wrap}
.err{color:#E7B77B;font-size:13px;margin-top:8px}
.hint{font-size:12px;color:rgba(246,241,230,.5);line-height:1.5;margin:0 0 14px}
.search{width:100%;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .pair{flex:1;min-width:0}
.row .a{font-family:'Fraunces',serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{font-size:13px;color:rgba(246,241,230,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lvl{font-size:10px;font-weight:600;letter-spacing:.04em;color:rgba(246,241,230,.5);border:1px solid var(--line);border-radius:5px;padding:2px 6px;white-space:nowrap}
.row .dots{flex-wrap:nowrap}
.row .dots span{background:rgba(246,241,230,.18)}
.row .dots span.f{background:rgba(246,241,230,.8)}
.row .dots span.g{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(246,241,230,.34)}
.row .dots span.h{background:rgba(246,241,230,.42)}
.row .dots.ret span{background:#E0B36B;box-shadow:none}
.row .del{background:none;border:0;color:rgba(246,241,230,.35);cursor:pointer;padding:4px;font-size:15px;line-height:1}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:rgba(246,241,230,.6)}
.rowdet{padding:6px 2px 16px;border-bottom:1px solid var(--line)}
.rowdet .ex{font-family:'Fraunces',serif;font-size:17px;line-height:1.55;margin:8px 0;padding-left:12px;border-left:2px solid var(--line);color:var(--paper)}
.rowdet .ex.it{border-left-color:var(--green)}
.rowdet .ex.de{border-left-color:var(--ochre);color:rgba(246,241,230,.82)}
.rowdet .ex.muted{border-left-color:transparent;padding-left:0;font-style:italic;color:rgba(246,241,230,.45)}
.rowdet .tags{display:flex;gap:8px;margin-top:12px;padding-left:12px}
.rowdet .tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:rgba(246,241,230,.72)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(30,45,47,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:rgba(246,241,230,.5);font-family:inherit;font-size:12px;font-weight:500;padding:14px 4px;cursor:pointer}
.tabs button.on{color:var(--paper)}
.atools{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.atools .ghost{padding:8px 12px}
.atools .seg{margin-left:auto}
.atools .seg button{padding:6px 11px;font-size:12px}
.astat{text-align:center;font-size:15px;color:rgba(246,241,230,.82);padding:16px 10px;min-height:26px;line-height:1.4}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";

/* ============ storage ============ */
// Words are loaded read-only from words.json in the repo; progress is per-device.
const LIB_KEY="lessico_lib_v1", SET_KEY="lessico_set_v1";
const WORDS_KEY="lessico_words_v1", PROG_KEY="lessico_prog_v1";
const DEFAULTS={direction:"de",levels:[],topics:[],sessionSize:20,learnY:3,rate:16,tunedAt:0,audioMode:"self",audioSentence:true,sfx:true};
const LANG={it:"it-IT",de:"de-DE"};
const ttsOK=("speechSynthesis" in window);
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const srOK=!!SRClass;
let audioOn=false, audioGen=0, curRecog=null, audioStatus="", voicesCache=[];
const ACtxClass=window.AudioContext||window.webkitAudioContext;
const audioFxOK=!!ACtxClass; let actx=null;
let settings={...DEFAULTS};
let lib=[];
const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()));

function norm(c){
  const it=(c.it&&typeof c.it==="object")?c.it:{word:c.it||"",sentence:c.its||""};
  const de=(c.de&&typeof c.de==="object")?c.de:{word:c.de||"",sentence:c.des||""};
  return {id:c.id||uid(),level:(c.level||"B1").toUpperCase(),topic:c.topic||"Other",
    it:{word:it.word||"",sentence:it.sentence||""},de:{word:de.word||"",sentence:de.sentence||""},
    streak:c.streak||0,correct:c.correct||0,seen:c.seen||0,seenAt:c.seenAt||0,ivl:c.ivl||0,due:c.due||0,retired:!!c.retired,
    stab:c.stab||0,jit:c.jit||1,best:c.best||0};
}
const stripWord=c=>({id:c.id,level:c.level,topic:c.topic,it:{word:c.it.word,sentence:c.it.sentence},de:{word:c.de.word,sentence:c.de.sentence}});
const BLANK_PROG={streak:0,correct:0,seen:0,seenAt:0,ivl:0,due:0,retired:false,stab:0,jit:1,best:0};
// "loading" until words.json has been fetched once; "failed" if it could not be reached and we
// have nothing stored. Only visible when the library is empty — a first visit with no network.
let libState="loading";
// ivl/due are unused by the stability scheduler but are written through untouched, so reverting
// to the old interval-based system stays lossless rather than resetting everyone's review queue.
const stripProg=c=>{const o={streak:c.streak||0,correct:c.correct||0,seen:c.seen||0};if(c.seenAt)o.seenAt=c.seenAt;if(c.ivl)o.ivl=c.ivl;if(c.due)o.due=c.due;if(c.retired)o.retired=true;if(c.stab)o.stab=Math.round(c.stab*100)/100;if(c.best)o.best=c.best;if(c.jit&&c.jit!==1)o.jit=Math.round(c.jit*100)/100;return o;};
const wordsFromLib=()=>lib.map(stripWord);
function progFromLib(){const p={};lib.forEach(c=>{p[c.id]=stripProg(c);});return p;}
function readJSON(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function buildLib(words,prog){return (words||[]).map(w=>norm({...w,...(prog&&prog[w.id]||{})}));}

function load(){
  try{const s=localStorage.getItem(SET_KEY);if(s)settings={...DEFAULTS,...JSON.parse(s)};}catch(e){}
  // migrate old single-select level/topic ("all" or one value) to arrays ([] = all)
  if(!Array.isArray(settings.levels))settings.levels=[];
  if(!Array.isArray(settings.topics))settings.topics=[];
  if(settings.level!==undefined){if(!settings.levels.length&&settings.level!=="all")settings.levels=[settings.level];delete settings.level;}
  if(settings.topic!==undefined){if(!settings.topics.length&&settings.topic!=="all")settings.topics=[settings.topic];delete settings.topic;}
  delete settings.deprecate;delete settings.retireN; // removed: time-based resurfacing and permanent retire
  settings.learnY=3; // baked in: 3 correct in a row = learned (matches the card's 3 dots / stars)
  // migrate legacy focus modes onto the 4-stop lifecycle dial
  delete settings.focus;delete settings.rateAuto; // no dial, no rate setting: the moods are the control
  if(!(settings.rate>0))settings.rate=16;
  if(settings.dirSet===undefined){settings.direction="de";settings.dirSet=true;saveSet();} // one-time: default to DE → IT (still changeable)
  if(settings.ssSet===undefined){settings.sessionSize=20;settings.ssSet=true;saveSet();} // one-time: default to 20 per session (still changeable)
  let words=readJSON(WORDS_KEY), prog=readJSON(PROG_KEY)||{};
  if(!Array.isArray(words)||!words.length){
    const legacy=readJSON(LIB_KEY); // one-time migration from the old single-blob format
    if(Array.isArray(legacy)&&legacy.length){
      const m=legacy.map(norm);words=m.map(stripWord);prog={};m.forEach(c=>{prog[c.id]=stripProg(c);});
    }else{words=[];}    // nothing stored yet: syncFromRepo fills it from words.json, the one source
    if(words.length){saveWordsLocal(words);saveProgNow(prog);}
  }
  lib=buildLib(words,prog);

  migrateKnew();
}
function saveSet(){try{localStorage.setItem(SET_KEY,JSON.stringify(settings));}catch(e){}}
function saveWordsLocal(words){try{localStorage.setItem(WORDS_KEY,JSON.stringify(words||wordsFromLib()));}catch(e){}}
let pt=null;
function saveProg(){if(pt)clearTimeout(pt);pt=setTimeout(()=>{pt=null;saveProgNow();},300);}
function saveProgNow(prog){if(pt)clearTimeout(pt);pt=null;try{localStorage.setItem(PROG_KEY,JSON.stringify(prog||progFromLib()));}catch(e){}}

/* ---- word list: loaded read-only from words.json in the repo; edits stay in this browser ---- */
function wordsUrl(){return new URL("words.json",location.href).href+"?t="+Date.now();}
async function syncFromRepo(){
  try{
    const res=await fetch(wordsUrl(),{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const remote=await res.json();
    if(!Array.isArray(remote)||!remote.length)throw new Error("empty word list");
    // Union by id (never drop words the user just added locally); repo content wins for shared words.
    const byId={};wordsFromLib().forEach(w=>{byId[w.id]=w;});
    let changed=remote.length!==Object.keys(byId).length;
    remote.forEach(w=>{if(!w||!w.id)return;const cur=byId[w.id];if(!cur||JSON.stringify(cur)!==JSON.stringify(stripWord(norm(w))))changed=true;byId[w.id]=stripWord(norm(w));});
    const wasLoading=libState!=="ready";
    libState="ready";
    if(changed){
      const words=Object.values(byId);
      saveWordsLocal(words);
      lib=buildLib(words,progFromLib());
    }
    const folded=foldStrays(new Set(remote.map(w=>w.id)));
    if(!changed&&!folded&&!wasLoading)return;
    if(!(view==="session"&&session&&session.active)){if(!session||!session.active)startSession();render();}
  }catch(e){
    if(libState!=="ready")libState="failed";
    if(!lib.length)render();
  }
}
// One-time cleanup. The app used to ship 100 built-in starter words inline, and they carried no
// ids — norm() minted a fresh one per browser, and the union above matches on id, so they stayed
// forever beside their words.json twins as duplicate cards with separate scores. Fold each stray
// into the repo word with the same pair, keeping whichever was practised more recently, and drop
// it. A word you added yourself has no twin in the repo list, so it is left alone.
function foldStrays(remoteIds){
  const byPair=new Map();
  lib.forEach(c=>{if(remoteIds.has(c.id))byPair.set(pairKey(c),c);});
  const keep=[];let folded=0;
  lib.forEach(c=>{
    if(remoteIds.has(c.id)){keep.push(c);return;}
    const twin=byPair.get(pairKey(c));
    if(!twin){keep.push(c);return;}
    const best=Math.max(twin.best||0,c.best||0);
    // reset first: stripProg omits zero fields, so a bare assign would leave stale ones behind
    if(newerThan(c,twin))Object.assign(twin,BLANK_PROG,stripProg(c),{best});
    else twin.best=best;
    folded++;
  });
  if(folded){lib=keep;saveWordsLocal();saveProgNow();}
  return folded;
}

/* ============ learning model ============ */
// Each word carries a STABILITY (stab, in days): roughly "how long it stays reliably
// retrievable" — at a gap equal to stab you have about an 85% chance of recall. A word is
// scheduled when that much time has passed, never sooner: showing it early is exactly what
// forfeits growth. A correct answer sets stability to 5x the gap you just proved you could
// survive (capped at 5x the old value); a miss cuts it to a third.
const DAY=864e5;
const S_START=1, S_GROW=5, S_EASY=15, S_MISS=3, S_RETIRE=625;
const S_D1=5, S_D2=25, S_D3=125;            // dot thresholds: ●○○  ●●○  ●●● (learned)
const dots=c=>{const s=c.stab||0;return s>=S_D3?3:s>=S_D2?2:s>=S_D1?1:0;};
const isSeen=c=>(c.stab||0)>0||!!c.retired;  // has been introduced
const inFlight=c=>isSeen(c)&&!c.retired;     // still in rotation
// A word that has been shown but never once recalled correctly has proved nothing, so it counts
// as new material rather than review: it never appears in a Review session and competes for the
// new-word slots instead. Growth only happens on a correct answer, so !started implies no dots.
const started=c=>(c.correct||0)>0;
const metOnly=c=>isSeen(c)&&!started(c);   // shown, but never yet recalled
const step=c=>c.retired?4:dots(c);         // 0..4: three dots, then retirement as the fourth
// The six bands the progress bar is built from, so the bar and the Words filter cannot drift apart:
// 0 not started · 1 met · 2 one dot · 3 two dots · 4 learned · 5 mastered
const band=c=>c.retired?5:(dots(c)>0?dots(c)+1:(isSeen(c)?1:0));
const BANDS=[[5,"s4","Mastered"],[4,"s3","Learned"],[3,"s2","\u25CF\u25CF\u25CB"],
             [2,"s1","\u25CF\u25CB\u25CB"],[1,"sm","Met"],[0,"s0","Not started"]];
const inReview=c=>inFlight(c)&&started(c);
const status=c=>c.retired?"retired":dots(c)>=3?"learned":"learning";
// count words matching a predicate and how many are done — for topic/level completion milestones
const tally=pred=>{let size=0,learned=0;for(const c of lib){if(pred(c)){size++;if(c.retired||dots(c)>=3)learned++;}}return{size,learned,done:size>0&&size===learned};};
const inFilter=c=>(!settings.levels.length||settings.levels.includes(c.level))&&(!settings.topics.length||settings.topics.includes(c.topic));
const front=()=>settings.direction==="it"||settings.direction==="de"?settings.direction:(Math.random()<.5?"it":"de");
// The side was baked into the queue when the session was created and survives in storage, so a
// session started under Mixed (or the other direction) kept showing the old side after the
// setting changed. Resolve it at paint time: a fixed direction always wins.
const sideOf=q=>settings.direction==="it"||settings.direction==="de"?settings.direction:((q&&q.f)||front());
// The very first interval is cadence-relative — "come back in about two sessions" — so someone
// doing five sessions a day gets review inside day one instead of a wall of new words.
const firstGap=()=>Math.max(1/24,Math.min(1,2/Math.max(.5,sessPerDay())));
const gapTarget=c=>{const s=c.stab||0;return s<=0?0:s<=S_START?firstGap():s*(c.jit||1);};
const dueAt=c=>(c.seenAt||0)+gapTarget(c)*DAY;
const overdue=c=>(Date.now()-(c.seenAt||0))/Math.max(1e-9,gapTarget(c)*DAY); // >=1 means due
const isDue=c=>inFlight(c)&&Date.now()>=dueAt(c);
const inSession=c=>inFilter(c)&&(isDue(c)||!isSeen(c));

/* ---- activity log: the only way to know how much time someone actually spends ---- */
const LOG_KEY="lessico_log_v1";
const dayNo=()=>Math.floor(Date.now()/DAY);
const logGet=()=>{const l=readJSON(LOG_KEY);return Array.isArray(l)?l:[];};
// Counters that accumulate across a day. Everything here is derived from answers as they happen
// and cannot be reconstructed afterwards — the card record only ever holds present state — so a
// day that goes unlogged is gone for good.
const DAY_FIELDS=["cards","sess","nw","revN","revOK","newN","newOK","ms","up","down"];
const blankDay=()=>{const t={d:dayNo(),back:0,learned:0,retired:0};DAY_FIELDS.forEach(k=>t[k]=0);return t;};
function logNote(f){
  const L=logGet();let t=L[L.length-1];
  if(!t||t.d!==dayNo()){t=blankDay();L.push(t);while(L.length>90)L.shift();}
  DAY_FIELDS.forEach(k=>{if(f[k])t[k]=(t[k]||0)+f[k];});
  if(f.back!=null)t.back=Math.max(t.back||0,f.back);
  if(f.learned!=null)t.learned=f.learned;
  if(f.retired!=null)t.retired=f.retired;

}
function logWrite(L){try{localStorage.setItem(LOG_KEY,JSON.stringify(L));}catch(e){}}
const logToday=()=>{const L=logGet(),t=L[L.length-1];return (t&&t.d===dayNo())?t:blankDay();};

function snapshotTotals(){
  let learned=0,retired=0;
  lib.forEach(c=>{if(c.retired)retired++;else if(dots(c)>=3)learned++;});
  logNote({learned,retired});

/* ---- review log: one row per genuine test, the only way to check the model against reality ---- */
// The scheduler bets that p(recall) = exp(-gap / (6.15 * stability)). Nothing has ever checked that
// bet. Each row is [day, gap*10, stabilityBefore*10, recalled, side, easy, seconds*10] — enough to
// bucket reviews by gap/stability and compare predicted recall against what actually happened.
// Stability is the value BEFORE the answer: that is what the prediction was made from.
const EV_KEY="lessico_ev_v1", EV_MAX=5000;
const evGet=()=>{const e=readJSON(EV_KEY);return Array.isArray(e)?e:[];};
function evPush(row){
  const E=evGet();E.push(row);
  while(E.length>EV_MAX)E.shift();

}
// localStorage is a hard wall shared with the word list; if we hit it, drop the oldest half rather
// than silently stopping — half a history still calibrates, a dead writer never recovers.
function evWrite(E){
  try{localStorage.setItem(EV_KEY,JSON.stringify(E));}
  catch(e){try{localStorage.setItem(EV_KEY,JSON.stringify(E.slice(Math.floor(E.length/2))));}catch(e2){}}
}
const avg=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:0;
// sessions per active day, from the last two weeks — drives the first interval only
function sessPerDay(){
  const act=logGet().slice(-14).filter(x=>x.sess>0);
  return act.length?Math.max(.5,Math.min(8,avg(act.map(x=>x.sess)))):1;
}
// Intake controller. Throughput is a censored signal (you can only complete what you were
// offered), so it is useless here — a rolling average of cards done spirals downward. Backlog
// is the honest one: it is an integral, so daily noise cancels, and it grows whether or not you
// show up. Wide deadband + slow asymmetric steps, because the feedback lag is months.
function tuneIntake(){
  const L=logGet();
  if(L.length<28||dayNo()-(settings.tunedAt||0)<14)return;
  const act=L.filter(x=>x.cards>0);
  if(act.length<8){settings.tunedAt=dayNo();saveSet();return;}
  const capEst=Math.max(1,avg(act.slice(-14).map(x=>x.cards)));
  const B=L.slice(-28).map(x=>x.back||0);
  const recent=avg(B.slice(-14)), prior=avg(B.slice(0,14));
  if(recent>capEst*2&&recent>prior*1.1)settings.rate*=.85;      // persistently and increasingly behind
  else if(recent<capEst*.25)settings.rate*=1.10;                // consistently caught up
  settings.rate=Math.max(2,Math.min(40,Math.round(settings.rate*10)/10));
  settings.tunedAt=dayNo();saveSet();
}
// New words per session, paced so a typical day lands near the daily rate. Deliberately NOT
// capped by a daily total: a hard cap makes every session after the budget is spent collapse to
// a handful of cards, which punishes you for studying more. Doing extra sessions earns extra new
// words; if that is too much, it shows up in the backlog and the controller lowers the rate.
function newQuota(){
  return Math.max(1,Math.round((settings.rate||16)/Math.max(1,sessPerDay())));
}
// Seed stability for progress made under the old streak model. Conservative: a word keeps the
// dots it had, so the counter does not drop, and a failed first long test only costs one dot.
// Under the earlier rule a correct first answer left the word at one day, indistinguishable from
// one that was missed. Give those their first dot: seen exactly once, right exactly once.
function migrateKnew(){
  if(settings.migKnew)return;
  let n=0;
  lib.forEach(c=>{if(!c.retired&&(c.seen||0)===1&&(c.correct||0)===1&&(c.stab||0)===S_START){
    c.stab=S_D1;c.streak=dots(c);c.best=Math.max(c.best||0,dots(c));n++;}});
  settings.migKnew=1;saveSet();
  if(n)saveProg();
}
function migrateStab(){
  let touched=false;

    const s=c.streak||0;
    c.stab=c.retired?S_RETIRE:s>=3?Math.max(S_D3,(c.ivl||0)*5):s===2?S_D2:s===1?S_D1:S_START;
    if(!c.seenAt)c.seenAt=Date.now();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ session ============ */
let session=null, flipped=false, view="session";
// When the current card first appeared, for time-on-card. Keyed to the queue head so a repaint —
// flipping, a mood change — does not restart the clock.
let cardShownAt=0, cardShownFor=null;
const SESS_KEY="lessico_sess_v1";
function saveSession(){try{if(session)localStorage.setItem(SESS_KEY,JSON.stringify(session));else localStorage.removeItem(SESS_KEY);}catch(e){}}
function clearSession(){session=null;try{localStorage.removeItem(SESS_KEY);}catch(e){}}
function loadSession(){
  try{const s=JSON.parse(localStorage.getItem(SESS_KEY));
    if(!s||!s.active||!Array.isArray(s.queue))return null;
    const q=s.queue.filter(x=>x&&x.id&&lib.some(c=>c.id===x.id)); // drop cards no longer in the library
    if(!q.length)return null;
    return {queue:q,total:s.total||q.length,learned:s.learned||0,missed:Array.isArray(s.missed)?s.missed:[],
      mood:s.mood||"auto",met:s.met||0,knew:s.knew||0,gained:s.gained||0,held:s.held||0,mastered:s.mastered||0,
      miss:s.miss||0,slipped:s.slipped||0,dotsUp:s.dotsUp||0,active:true};
  }catch(e){return null;}
}
// Today's mood is a per-session choice, not a setting: it reverts to Normal once the session
// starts, so there is nothing to forget you changed. It sets PRIORITY inside the session; the
// controller above owns the long-run rate.
let nextMood="auto";
const NOV_SHARE=.5, GUARD=2.5;              // Novelty aims for ~half the session new; throttled past GUARD sessions of backlog
const NEW_FLOOR=.15, STOP_NEW=5;
const MIN_EARLY=.5;   // a pulled-forward word must be at least halfway to its slot to be worth asking            // Normal keeps ~15% new until the backlog passes 5 sessions
function interleave(a,b){const out=[],n=a.length+b.length;let i=0,j=0;
  for(let k=0;k<n;k++){
    if(i>=a.length)out.push(b[j++]);
    else if(j>=b.length)out.push(a[i++]);
    else if((i+1)/a.length<=(j+1)/b.length)out.push(a[i++]);
    else out.push(b[j++]);
  }
  return out;}
// Compose a session honouring the focus dial: pure pools at the ends, ratio-blended new+in-progress
// in the middle. The ratio is a goal — clamp to what's available and backfill so the session is never
// short, then interleave so new and review aren't blocked into runs.
// Reviews are no longer a choice — the schedule decides them. What is left is how many new
// words to let in, and in what order. `size` is a comfort cap, not a target: when little is due
// the session is genuinely short, and that means you are caught up rather than that it is broken.
function pickCards(size,mood){
  const inF=lib.filter(inFilter);
  const due=inF.filter(c=>inReview(c)&&isDue(c)).sort((a,b)=>overdue(b)-overdue(a)); // most overdue first
  // New material: never shown, plus anything shown but never yet recalled. The latter go first so
  // a few hundred untouched words can't bury the ones you have already met once.
  const unstarted=shuffle(inF.filter(c=>isSeen(c)&&!c.retired&&!started(c)&&isDue(c)));
  const newPool=unstarted.concat(shuffle(inF.filter(c=>!isSeen(c))));
  const backlog=Math.max(0,due.length-size);
  const guard=backlog>size*GUARD;   // novelty is throttled once you are genuinely behind
  const m=(mood==="explore"&&guard)?"auto":(mood||"auto");
  let nNew=0,nRev=0;
  if(m==="review"){nRev=Math.min(due.length,size);}
  else{
    // A backlog shouldn't mean zero new words — that makes an ordinary busy week feel like the
    // app has stopped moving. Keep a small slice for new material until the backlog is genuinely
    // huge, and only then hand the whole session to reviews. The floor never exceeds the quota,
    // so the controller still has the last word on the long-run rate.
    const quota=newQuota();
    const floor=backlog>size*STOP_NEW?0:Math.min(quota,Math.max(1,Math.round(size*NEW_FLOOR)));
    const paced=Math.min(quota,size-Math.min(due.length,size-floor),newPool.length); // what Auto takes
    // Explore lifts the new-word count to about half the session and leaves the rest to review,
    // rather than swallowing every free slot. The two moods should differ by degree, not be
    // different universes. Taking the max keeps Explore >= Auto even when the pace is high.
    nNew=m==="explore"?Math.max(paced,Math.min(newPool.length,Math.round(size*NOV_SHARE))):paced;
    nRev=Math.min(due.length,size-nNew);
  }
  // Heavy start: on a filter with nothing in rotation yet there is no review to protect, so
  // fill the whole session with new words rather than handing back a three-card sitting.
  if(m!=="review"&&!inF.some(inReview))nNew=Math.min(size,newPool.length);
  let revs=due.slice(0,nRev), news=newPool.slice(0,nNew);
  // Top up a short session rather than handing back five cards when there is plenty to practise.
  // First with the words closest to coming round again: answering one early earns little growth
  // (the gain is capped by the gap actually elapsed) but it is honest practice and it leaves the
  // new-word pacing intact. Only if those run out do we reach past the pace for more new words.
  const room=()=>size-revs.length-news.length;
  if(room()>0){

    // so below a fifth of its slot a correct answer moves nothing at all — asking it is pure
    // padding. Half its slot still roughly doubles stability, so that is the floor; anything
    // shorter is left alone and new words fill the space instead.
    const have=new Set([...revs,...news].map(c=>c.id));
    revs=revs.concat(inF.filter(c=>inReview(c)&&!have.has(c.id)&&overdue(c)>=MIN_EARLY)
      .sort((a,b)=>overdue(b)-overdue(a)).slice(0,room()));
  }
  if(room()>0&&m!=="review"){
    const have=new Set([...revs,...news].map(c=>c.id));
    news=news.concat(newPool.filter(c=>!have.has(c.id)).slice(0,room()));
  }
  return interleave(news,shuffle(revs));

const backlogNow=()=>{const size=Math.max(1,settings.sessionSize|0);

  // the engine already refuses to score it. Measuring it would flatter the recall rate, so the log
  // applies the same guard. Captured before the arrays below are touched.
  const firstTry=!session.missed.includes(c.id);

    // time it appears is real information, not merely having seen it. A correct first answer is
    // worth the first dot, the same as surviving a one-day gap; only a wrong one leaves the word
    // as met-but-not-known. "Easy" still means "skip the early rungs", verified before it retires.
    c.stab=easy?30:(known?S_D1:S_START);

    else{session.missed.push(c.id);session.met=(session.met||0)+1;}

    // (the gap is ~0 by then), so a card can move at most one step per session in either direction.
    if(!session.missed.includes(c.id)){

      // reporting only the crossings made a good session look like almost nothing happened.
      if(dots(c)>was)session.dotsUp=(session.dotsUp||0)+1;

function el(tag,props,kids){const e=document.createElement(tag);

    if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);

// progress of one topic within a level scope (levelOk predicate): null = no words, else learned fraction 0..1
function topicProgress(topic,levelOk){
  const ws=lib.filter(c=>c.topic===topic&&(levelOk?levelOk(c):true));
  if(!ws.length)return null;
  // average ripeness (0..1) on the four-step scale: three dots then retirement, so "everything
  // learned" is 0.75 and only a fully retired topic reaches 1 — the colour keeps deepening.
  return ws.reduce((a,c)=>a+step(c),0)/(ws.length*4);

function progText(p,on){
  if(p==null)return on?"":"rgba(246,241,230,.4)";
  // q rises steeply at the start: a topic a few percent in should already look different from an
  // untouched one, while the top of the range stays reserved for genuinely mastered topics.
  const q=Math.pow(Math.max(0,Math.min(1,p)),.5);

async function doImport(){

  if(text==null){importMsg={bad:true,text:"Could not read that file."};return render();}
  let parsed;
  try{parsed=parseImport(text);}catch(e){parsed=null;}
  if(!parsed||!Object.keys(parsed.prog).length){
    importMsg={bad:true,text:"That doesn't look like a lessico export — no scores found in it."};
    return render();}
  const plan=planImport(parsed);
  if(!plan.scored){
    importMsg={bad:true,text:"That file has no scores in it, only words."};
    return render();}
  // A backup made after this one may still carry days and reviews this browser never saw, so an
  // import that moves no score can still be worth doing.
  const hist=(parsed.log.length||parsed.events.length);
  if(!plan.update&&!plan.add.length&&!hist){
    importMsg={text:"Nothing to import — this browser is already at least as far along on all "+plan.keep+" words."};
    return render();}
  const bits=[];
  if(plan.update)bits.push(plan.update+" word"+(plan.update===1?"":"s")+" updated");
  if(plan.add.length)bits.push(plan.add.length+" word"+(plan.add.length===1?"":"s")+" added");
  if(plan.keep)bits.push(plan.keep+" left as they are, being newer here");
  if(plan.unknown)bits.push(plan.unknown+" skipped, not in this collection");
  if(hist)bits.push("plus your study history");
  if(!await ask("Import these scores?",bits.join(", ")+".","Import"))return;
  applyImport(parsed,plan);
  const h=mergeHistory(parsed.log,parsed.events);
  const done=bits.filter(b=>!/^plus your/.test(b));
  if(h.days||h.rows)done.push(h.days+" new day"+(h.days===1?"":"s")+" and "+h.rows+" review"+(h.rows===1?"":"s")+" of history");
  importMsg={text:"Imported. "+(done.length?done.join(", "):"nothing new")+"."};
  render();

// Scores live in this browser's localStorage, keyed by word id, so a second browser starts
// blank. Export there, import here. Words are matched by id, which is stable across devices
// because the shared dictionary ships them.
function pickFile(cb){
  const inp=el("input",{type:"file",accept:"application/json,.json",style:{display:"none"},
    onchange:()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;

function parseImport(text){

    if(Array.isArray(data.words)){                              // v2: words plus history
      takeCards(data.words);

      if(Array.isArray(data.events))events=data.events.filter(x=>Array.isArray(x)&&x.length>=4);

// History merges too, and has to survive being imported twice. Days are keyed by date and the
// busier record wins rather than being summed, so a repeated import cannot inflate the past;
// review rows are deduped on their full contents for the same reason.
function mergeHistory(log,events){
  let days=0,rows=0;
  if(log&&log.length){
    const byDay=new Map(logGet().map(t=>[t.d,t]));
    log.forEach(t=>{const cur=byDay.get(t.d);
      if(!cur||(t.cards||0)>(cur.cards||0)){byDay.set(t.d,t);if(!cur)days++;}});
    const merged=[...byDay.values()].sort((a,b)=>a.d-b.d).slice(-90);

const pairKey=c=>((c.it&&c.it.word)||"").trim().toLowerCase()+"|"+((c.de&&c.de.word)||"").trim().toLowerCase();
const newerThan=(p,c)=>{
  const theirs=p.seenAt||0, mine=c.seenAt||0;
  if(theirs!==mine)return theirs>mine;
  return mine===0&&(p.correct||0)>(c.correct||0);   // neither dated: prefer the one with a record

// Match each incoming word to a local one by id, falling back to the word pair. The fallback
// matters because the built-in starter deck ships without ids, so every browser minted its own
// for those 100 words — matching on id alone would import them as a second copy of each.
function resolveImport({prog,words}){
  const byId=new Map(lib.map(c=>[c.id,c]));
  const byPair=new Map();lib.forEach(c=>{const k=pairKey(c);if(!byPair.has(k))byPair.set(k,c);});
  const target=new Map();                                  // incoming id -> local card
  words.forEach(w=>{const c=byId.get(w.id)||byPair.get(pairKey(w));if(c)target.set(w.id,c);});
  Object.keys(prog).forEach(id=>{if(!target.has(id)&&byId.has(id))target.set(id,byId.get(id));});
  return {target,add:words.filter(w=>!target.has(w.id))};

// Per word the more recent practice wins, so importing an older backup can never roll back a
// word you have practised since. Words the file has and this browser doesn't are carried over
// too — otherwise scores for anything added on the other device would land nowhere.
function planImport(parsed){
  const {target,add}=resolveImport(parsed);
  let update=0,keep=0,unknown=0;
  Object.keys(parsed.prog).forEach(id=>{
    const c=target.get(id);
    if(!c){if(!add.some(w=>w.id===id))unknown++;return;}
    if(newerThan(parsed.prog[id],c))update++;else keep++;

  return {target,add,update,keep,unknown,
    scored:Object.keys(parsed.prog).filter(id=>hasScore(parsed.prog[id])).length};

function applyImport({prog},plan){
  plan.add.forEach(w=>{const c=norm({...w,...(prog[w.id]||{})});lib.push(c);});
  Object.keys(prog).forEach(id=>{
    const c=plan.target.get(id);if(!c||!newerThan(prog[id],c))return;
    const best=Math.max(c.best||0,prog[id].best||0);   // display-only high-water mark: keep the higher
    Object.assign(c,BLANK_PROG,prog[id],{best});

function snapTopic(t){
  const c=(t||"").trim();if(!c)return "Other";
  const hit=Array.from(new Set(lib.map(x=>x.topic))).find(x=>x.toLowerCase()===c.toLowerCase());
  return hit||c; // reuse existing casing when it's the same topic
}

/* ============ hands-free audio ============ */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const alive=gen=>audioOn&&gen===audioGen;
function loadVoices(){try{voicesCache=speechSynthesis.getVoices()||[];}catch(e){voicesCache=[];}}
function pickVoice(lang){const p=lang.slice(0,2).toLowerCase();if(!voicesCache.length)loadVoices();
  return voicesCache.find(v=>v.lang&&v.lang.toLowerCase().replace("_","-")===lang.toLowerCase())
    ||voicesCache.find(v=>v.lang&&v.lang.toLowerCase().slice(0,2)===p)||null;}
if(ttsOK){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function speak(text,lang){return new Promise(res=>{
  if(!ttsOK||!text){res();return;}
  let done=false;const fin=()=>{if(done)return;done=true;res();};
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;u.rate=.95;
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
    setTimeout(fin,Math.min(12000,1500+text.length*90));
  }catch(e){fin();}
});}
function settle(){
  // Wait until text-to-speech has fully stopped, then a short buffer, so the
  // mic never records our own speech (which caused wrong answers).
  return (async()=>{
    for(let i=0;i<80&&ttsOK&&speechSynthesis.speaking;i++)await wait(50); // up to ~4s
    await wait(400);
  })();
}
async function listen(lang,timeout){
  if(!srOK)return "";
  await settle();
  return new Promise(res=>{
    let done=false,to=null;
    const fin=v=>{if(done)return;done=true;if(to)clearTimeout(to);try{r.stop();}catch(e){}if(curRecog===r)curRecog=null;res(v);};
    const r=new SRClass();curRecog=r;r.lang=lang;r.interimResults=false;r.maxAlternatives=1;r.continuous=false;
    r.onresult=e=>{try{fin((e.results[0][0].transcript||"").trim());}catch(_){fin("");}};
    r.onerror=()=>fin("");r.onend=()=>fin("");
    to=setTimeout(()=>fin(""),timeout||6000);
    try{r.start();}catch(e){fin("");}
  });
}
function normWord(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/['’]/g," ").replace(/[^a-z\s]/g," ")
  .replace(/\b(il|lo|la|i|gli|le|un|uno|una|der|die|das|den|dem|des|ein|eine|einen|einem|to|the|sich)\b/g," ")
  .replace(/\s+/g," ").trim();}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const d=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let prev=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}return d[n];}
function similar(said,target){
  const a=normWord(said),b=normWord(target);if(!a||!b)return false;if(a===b)return true;
  const at=a.split(" ").filter(Boolean),bt=b.split(" ").filter(Boolean);
  const hit=bt.filter(tb=>at.some(ta=>ta===tb||(tb.length>3&&(ta.includes(tb)||tb.includes(ta)))||lev(ta,tb)<=Math.max(1,Math.floor(tb.length/4)))).length;
  if(bt.length===1?hit>=1:hit>=bt.length)return true;
  return lev(a,b)/Math.max(a.length,b.length)<=0.34;
}
function parseYesNo(t){const s=(t||"").toLowerCase();if(!s)return null;
  if(/\b(no|nope|nah|nein|falsch|sbagliat\w*|wrong|missed|miss|forgot)\b/.test(s))return false;
  if(/\b(yes|yeah|yep|yup|right|correct|knew|know|known|got|ja|genau|richtig|si|s[iì]|ok|okay|good)\b/.test(s))return true;
  return null;}
async function listenYesNo(gen){
  for(let k=0;k<2;k++){if(!alive(gen))return null;
    const yn=parseYesNo(await listen("en-US",6000));
    if(yn!==null)return yn;
    if(k===0)setAStat("🎙 Yes or no?");}
  return null;}
async function listenCommand(gen){
  // Wait for the learner to speak before revealing — any word counts as the command.
  while(alive(gen)){const t=await listen("en-US",8000);if(!alive(gen))return;if(t&&t.trim())return;await wait(150);}
}
async function listenAnswer(lang,gen){
  // Keep listening (restarting if the recognizer stops on silence) for a
  // generous window before giving up, so slow answers still register.
  const end=Date.now()+14000;
  while(alive(gen)&&Date.now()<end){
    const t=await listen(lang,Math.min(8000,end-Date.now()));
    if(!alive(gen))return "";
    if(t&&t.trim())return t.trim();
  }
  return "";
}
function setAStat(s){audioStatus=s;const e=document.getElementById("astat");if(e)e.textContent=s;}
function reveal(){flipped=true;const cd=document.querySelector(".card");if(cd)cd.classList.add("flip");}
async function speakFace(c,lang,btn){
  if(!ttsOK)return;
  if(btn)btn.classList.add("playing");
  try{await speak(c[lang].word,LANG[lang]);if(c[lang].sentence)await speak(c[lang].sentence,LANG[lang]);}catch(e){}
  if(btn)btn.classList.remove("playing");
}
function stopAudio(){audioOn=false;audioGen++;audioStatus="";try{if(ttsOK)speechSynthesis.cancel();}catch(e){}if(curRecog){try{curRecog.abort();}catch(e){}curRecog=null;}}
async function runHandsFree(){
  if(!ttsOK)return;
  stopAudio();audioGen++;const gen=audioGen;audioOn=true;audioStatus="";
  if(!session||!session.active)startSession();
  paintSession();
  try{
    while(alive(gen)&&session&&session.active){
      const head=session.queue[0],c=cur();if(!c)break;
      const f=sideOf(head),b=f==="it"?"de":"it";
      flipped=false;const cd=document.querySelector(".card");if(cd)cd.classList.remove("flip");
      setAStat("🔊 "+(f==="it"?"Italian":"German")+"…");
      await speak(c[f].word,LANG[f]);
      if(settings.audioSentence&&c[f].sentence)await speak(c[f].sentence,LANG[f]);
      if(!alive(gen))break;
      let known;
      if(settings.audioMode==="auto"&&srOK){
        setAStat("🎙 Now say it in "+(b==="it"?"Italian":"German")+"…");
        const said=await listenAnswer(LANG[b],gen);
        if(!alive(gen))break;
        known=similar(said,c[b].word);
        reveal();setAStat((known?"✓ ":"✕ ")+(said?("“"+said+"”"):"(no answer)"));
        await speak(known?"Correct.":(said?"Not quite.":"I didn’t hear you."),"en-US");
        if(!alive(gen))break;
        await speak(c[b].word,LANG[b]);
        if(settings.audioSentence&&c[b].sentence)await speak(c[b].sentence,LANG[b]);
      }else{
        if(srOK){
          setAStat("🎙 Say “reveal” when you’re ready…");
          await listenCommand(gen);
          if(!alive(gen))break;
        }else{await wait(1300);if(!alive(gen))break;}
        reveal();setAStat("🔊 "+(b==="it"?"Italian":"German")+"…");
        await speak(c[b].word,LANG[b]);
        if(settings.audioSentence&&c[b].sentence)await speak(c[b].sentence,LANG[b]);
        if(!alive(gen))break;
        if(srOK){
          setAStat("🎙 Knew it? Say “yes” or “no”.");
          known=await listenYesNo(gen);
          if(!alive(gen))break;
          if(known===null){setAStat("Didn’t catch that — tap ✓ or ✕.");audioOn=false;paintSession();return;}
        }else{setAStat("Tap ✓ or ✕ to rate.");audioOn=false;paintSession();return;}
      }
      if(!alive(gen))break;
      await wait(450);
      rate(known);paintCounts();
      if(alive(gen)&&session.active)paintSession();
    }
  }catch(e){}
  if(gen===audioGen)audioOn=false;
  if(session&&!session.active)paintSession();
}

/* ============ boot ============ */
load();
session=loadSession();          // resume an in-progress session across reloads
if(!session)startSession();
render();
syncFromRepo();

/* Register the service worker so the app auto-updates online and works offline. */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
</script>
